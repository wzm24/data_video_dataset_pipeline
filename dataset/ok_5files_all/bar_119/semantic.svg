<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#ffffff"/>
<text x="640.0" y="44" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#222">Democrats more likely than Republicans</text>
<text x="640.0" y="80" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#222">to say they favor several police</text>
<text x="640.0" y="116" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#222">reform proposals</text>
<rect x="950" y="158" width="18" height="12" fill="#457882"/>
<text x="974" y="169" font-family="Arial" font-size="14" fill="#222">Strongly</text>
<rect x="1130" y="158" width="18" height="12" fill="#58d0d2"/>
<text x="1154" y="169" font-family="Arial" font-size="14" fill="#222">Somewhat</text>
<text x="482.0" y="218.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Require police to be trained</text>
<text x="482.0" y="234.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">in nonviolent alternatives to</text>
<text x="482.0" y="250.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">deadly force</text>
<rect x="500.0" y="215.0" width="588.0" height="38" fill="#457882"/>
<text x="1080.0" y="240.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">84</text>
<rect x="1088.0" y="215.0" width="70.0" height="38" fill="#58d0d2"/>
<text x="1150.0" y="240.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#222222">10</text>
<text x="1168.0" y="240.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">94</text>
<text x="482.0" y="318.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Create a federal government</text>
<text x="482.0" y="334.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">databaseto track officers</text>
<text x="482.0" y="350.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">accused of misconduct</text>
<rect x="500.0" y="315.0" width="539.0" height="38" fill="#457882"/>
<text x="1031.0" y="340.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">77</text>
<rect x="1039.0" y="315.0" width="112.0" height="38" fill="#58d0d2"/>
<text x="1143.0" y="340.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#222222">16</text>
<text x="1161.0" y="340.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">93</text>
<text x="482.0" y="402.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Give civilian oversight boards</text>
<text x="482.0" y="418.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">power to investigate and</text>
<text x="482.0" y="434.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">discipline officers accused of</text>
<text x="482.0" y="450.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">inappropriate use of force or</text>
<text x="482.0" y="466.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">other misconduct</text>
<rect x="500.0" y="415.0" width="434.0" height="38" fill="#457882"/>
<text x="926.0" y="440.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">62</text>
<rect x="934.0" y="415.0" width="189.0" height="38" fill="#58d0d2"/>
<text x="1115.0" y="440.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#222222">27</text>
<text x="1133.0" y="440.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">89</text>
<text x="482.0" y="518.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Make it a crime for police to</text>
<text x="482.0" y="534.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">use chokeholds or</text>
<text x="482.0" y="550.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">strangleholds</text>
<rect x="500.0" y="515.0" width="469.0" height="38" fill="#457882"/>
<text x="961.0" y="540.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">67</text>
<rect x="969.0" y="515.0" width="147.0" height="38" fill="#58d0d2"/>
<text x="1108.0" y="540.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#222222">21</text>
<text x="1126.0" y="540.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">88</text>
<text x="482.0" y="618.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Require officers to live in</text>
<text x="482.0" y="634.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">the cities or towns they</text>
<text x="482.0" y="650.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">police</text>
<rect x="500.0" y="615.0" width="301.0" height="38" fill="#457882"/>
<text x="793.0" y="640.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">43</text>
<rect x="801.0" y="615.0" width="266.0" height="38" fill="#58d0d2"/>
<text x="1059.0" y="640.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#222222">38</text>
<text x="1077.0" y="640.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">81</text>
</svg>