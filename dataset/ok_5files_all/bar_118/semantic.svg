<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#ffffff"/>
<text x="640.0" y="44" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#222">Broad support among Americans for</text>
<text x="640.0" y="80" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#222">several policing policies</text>
<rect x="950" y="122" width="18" height="12" fill="#6e45a3"/>
<text x="974" y="133" font-family="Arial" font-size="14" fill="#222">Strongly</text>
<rect x="1130" y="122" width="18" height="12" fill="#a98dd6"/>
<text x="1154" y="133" font-family="Arial" font-size="14" fill="#222">Somewhat</text>
<text x="482.0" y="182.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Require police to be trained</text>
<text x="482.0" y="198.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">in nonviolent alternatives to</text>
<text x="482.0" y="214.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">deadly force</text>
<rect x="500.0" y="179.0" width="497.0" height="38" fill="#6e45a3"/>
<text x="989.0" y="204.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">71</text>
<rect x="997.0" y="179.0" width="154.0" height="38" fill="#a98dd6"/>
<text x="1143.0" y="204.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">22</text>
<text x="1161.0" y="204.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">93</text>
<text x="482.0" y="282.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Create a federal government</text>
<text x="482.0" y="298.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">database to track officers</text>
<text x="482.0" y="314.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">accused of misconduct</text>
<rect x="500.0" y="279.0" width="434.0" height="38" fill="#6e45a3"/>
<text x="926.0" y="304.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">62</text>
<rect x="934.0" y="279.0" width="189.0" height="38" fill="#a98dd6"/>
<text x="1115.0" y="304.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">27</text>
<text x="1133.0" y="304.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">89</text>
<text x="482.0" y="366.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Give civilian oversight boards</text>
<text x="482.0" y="382.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">power to investigate and</text>
<text x="482.0" y="398.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">discipline officers accused of</text>
<text x="482.0" y="414.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">inappropriate use of force or</text>
<text x="482.0" y="430.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">other misconduct</text>
<rect x="500.0" y="379.0" width="301.0" height="38" fill="#6e45a3"/>
<text x="793.0" y="404.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">43</text>
<rect x="801.0" y="379.0" width="224.0" height="38" fill="#a98dd6"/>
<text x="1017.0" y="404.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">32</text>
<text x="1035.0" y="404.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">75</text>
<text x="482.0" y="482.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Make it a crime for police to</text>
<text x="482.0" y="498.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">use chokeholds or</text>
<text x="482.0" y="514.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">strangleholds</text>
<rect x="500.0" y="479.0" width="343.0" height="38" fill="#6e45a3"/>
<text x="835.0" y="504.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">49</text>
<rect x="843.0" y="479.0" width="175.0" height="38" fill="#a98dd6"/>
<text x="1010.0" y="504.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">25</text>
<text x="1028.0" y="504.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">74</text>
<text x="482.0" y="582.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">Require officers to live in</text>
<text x="482.0" y="598.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">the cities or towns they</text>
<text x="482.0" y="614.0" text-anchor="end" font-family="Arial" font-size="15" fill="#222">police</text>
<rect x="500.0" y="579.0" width="245.0" height="38" fill="#6e45a3"/>
<text x="737.0" y="604.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">35</text>
<rect x="745.0" y="579.0" width="273.0" height="38" fill="#a98dd6"/>
<text x="1010.0" y="604.0" text-anchor="end" font-family="Arial" font-size="16" font-weight="700" fill="#ffffff">39</text>
<text x="1028.0" y="604.0" font-family="Arial" font-size="20" font-weight="700" fill="#222">74</text>
</svg>