<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f8f8f8"/>
<text x="640" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#222">Among those who say there is too much economic inequality,</text>
<text x="640" y="76" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#222">most say the federal government and large corporations</text>
<text x="640" y="108" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#222">should have a lot of responsibility in reducing inequality</text>
<text x="604.0" y="197.0" text-anchor="end" font-family="Arial" font-size="18" fill="#333">The federal govt.</text>
<rect x="620.0" y="173.0" width="409.2" height="34" fill="#4e9a4e"/>
<text x="1039.2" y="197.0" font-family="Arial" font-size="22" font-weight="700" fill="#222">66%</text>
<text x="604.0" y="283.0" text-anchor="end" font-family="Arial" font-size="18" fill="#333">Large businesses/corporations</text>
<rect x="620.0" y="259.0" width="384.4" height="34" fill="#4e9a4e"/>
<text x="1014.4" y="283.0" font-family="Arial" font-size="22" font-weight="700" fill="#222">62%</text>
<text x="604.0" y="369.0" text-anchor="end" font-family="Arial" font-size="18" fill="#333">State governments</text>
<rect x="620.0" y="345.0" width="322.4" height="34" fill="#d1d1d1"/>
<text x="952.4" y="369.0" font-family="Arial" font-size="22" font-weight="700" fill="#222">52%</text>
<text x="604.0" y="455.0" text-anchor="end" font-family="Arial" font-size="18" fill="#333">Wealthy individuals</text>
<rect x="620.0" y="431.0" width="285.2" height="34" fill="#d1d1d1"/>
<text x="915.2" y="455.0" font-family="Arial" font-size="22" font-weight="700" fill="#222">46%</text>
<text x="604.0" y="541.0" text-anchor="end" font-family="Arial" font-size="18" fill="#333">Churches and other religious organizations</text>
<rect x="620.0" y="517.0" width="80.6" height="34" fill="#d1d1d1"/>
<text x="710.6" y="541.0" font-family="Arial" font-size="22" font-weight="700" fill="#222">13%</text>
<text x="640" y="680" text-anchor="middle" font-family="Arial" font-size="13" fill="#777">Source: Survey of U.S. adults conducted Sept. 16-29, 2019. PEW RESEARCH CENTER</text>
</svg>